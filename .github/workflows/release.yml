name: 发布插件

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验发布说明
        run: npm run release:check -- "${{ github.ref_name }}"

      - name: 构建插件
        run: npm run build

      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Canvas Loom ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            manifest.json
            main.js
            styles.css
